# ==============================================================================
# Real-Time Fraud & Financial Risk Detection Pipeline Configuration
# ==============================================================================

project:
  name: "realtime-fraud-detection-engine"
  version: "1.0.0"
  random_seed: 42

data:
  raw_path: "data/raw/creditcard.csv"
  processed_dir: "data/processed"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratify_col: "Class"
  download_url: "https://raw.githubusercontent.com/nsethi31/Kaggle-Data-Credit-Card-Fraud-Detection/master/creditcard.csv"

features:
  time_col: "Time"
  amount_col: "Amount"
  target_col: "Class"
  cyclic_time: true
  interaction_pairs:
    - ["V14", "V17"]
    - ["V12", "V10"]
    - ["V11", "V4"]
    - ["V16", "V18"]

models:
  baseline_logistic:
    penalty: "l2"
    C: 0.1
    class_weight: "balanced"
    max_iter: 1000
    solver: "lbfgs"

  lightgbm:
    n_estimators: 300
    learning_rate: 0.03
    max_depth: 6
    num_leaves: 31
    scale_pos_weight: 15.0
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 250
    learning_rate: 0.03
    max_depth: 5
    scale_pos_weight: 15.0
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    eval_metric: "aucpr"

  deep_tabular_resnet:
    hidden_dim: 128
    num_blocks: 3
    dropout: 0.25
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 512
    epochs: 25
    patience: 6
    focal_loss_gamma: 2.0
    focal_loss_alpha: 0.85

evaluation:
  cost_analysis:
    false_positive_cost: 50.0   # Cost of investigating a legitimate transaction flagged as fraud ($)
    false_negative_multiplier: 1.0 # 100% of transaction amount lost if fraud is missed
    default_fixed_fraud_loss: 150.0
  threshold_grid_steps: 100
  artifacts_dir: "artifacts"
  figures_dir: "artifacts/figures"
  models_dir: "artifacts/models"
